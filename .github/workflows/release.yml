name: Release

on:
  workflow_dispatch:
    inputs:
      specifier:
        description: 'Version bump (patch, minor, major, or an exact version). Leave empty to derive it from conventional commits.'
        required: false
        default: ''

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Version and release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Authenticate as "PushBased Bot" GitHub App
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Fetch GitHub App's user ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Configure Git user
        run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # Installs the pnpm version of the packageManager field
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Bumps the version, writes the changelog, commits, tags, pushes and
      # creates the GitHub Release. The pushed tag triggers publish.yml.
      - name: Version, release and generate changelog
        run: pnpm nx release $SPECIFIER --skip-publish
        env:
          SPECIFIER: ${{ inputs.specifier }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
