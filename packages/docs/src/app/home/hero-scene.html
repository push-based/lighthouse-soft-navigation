<div class="scene" aria-hidden="true">
  <div class="glow"></div>

  <div class="card">
    <div class="bar">
      <span class="dots"><i></i><i></i><i></i></span>
      <span class="bar-title">Lighthouse user flow</span>
    </div>

    <!-- The same flow, first on stock Lighthouse, then with the config. -->
    <div class="switch">
      <span class="switch-thumb"></span>
      <span class="switch-option switch-stock">Stock Lighthouse</span>
      <span class="switch-option switch-config">With the config</span>
    </div>

    <ol class="steps">
      <li class="step">
        <span class="step-num">1</span>
        <span class="step-text">
          <span class="step-name">Page load</span>
          <code class="step-code">flow.navigate('https://shop.example')</code>
          <span class="status"
            ><span class="status-line status-static"
              >Measured as a navigation</span
            ></span
          >
        </span>
        <span class="gauge gauge-average">
          <svg viewBox="0 0 40 40">
            <circle class="gauge-track" cx="20" cy="20" r="17" />
            <circle class="gauge-arc" cx="20" cy="20" r="17" />
          </svg>
          <span class="gauge-value">88</span>
        </span>
      </li>

      <li class="step step-soft">
        <span class="step-num">2</span>
        <span class="step-text">
          <span class="step-name">Soft navigation</span>
          <code class="step-code"
            >flow.navigate(() =&gt; page.click('a.products'))</code
          >
          <span class="status">
            <span class="status-line status-wait"
              >Waiting for a page load…</span
            >
            <span class="status-line status-error">Fails with NO_FCP</span>
            <span class="status-line status-measure"
              >Measuring from the click…</span
            >
            <span class="status-line status-ok">
              <span class="chip">FCP <b>0.4 s</b></span>
              <span class="chip">LCP <b>0.7 s</b></span>
            </span>
          </span>
        </span>
        <span class="gauge-slot">
          <span class="gauge gauge-pending">
            <svg viewBox="0 0 40 40">
              <circle class="gauge-track" cx="20" cy="20" r="17" />
              <circle class="gauge-arc" cx="20" cy="20" r="17" />
            </svg>
          </span>
          <span class="gauge gauge-fail">
            <svg viewBox="0 0 40 40">
              <circle class="gauge-arc" cx="20" cy="20" r="17" />
            </svg>
            <span class="gauge-value">!</span>
          </span>
          <span class="gauge gauge-pass">
            <svg viewBox="0 0 40 40">
              <circle class="gauge-track" cx="20" cy="20" r="17" />
              <circle class="gauge-arc" cx="20" cy="20" r="17" />
            </svg>
            <span class="gauge-value">97</span>
          </span>
        </span>
      </li>
    </ol>
  </div>
</div>
