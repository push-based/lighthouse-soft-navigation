<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>
      lighthouse-soft-navigation · Soft navigations, measured as navigations
    </title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Measure soft navigations as navigation steps of a Lighthouse user flow, with FCP, LCP and a Performance score, on stock Lighthouse."
    />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0D121C"
      media="(prefers-color-scheme: dark)"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="lighthouse-soft-navigation" />
    <meta
      property="og:title"
      content="lighthouse-soft-navigation · Soft navigations, measured as navigations"
    />
    <meta
      property="og:description"
      content="Measure soft navigations as navigation steps of a Lighthouse user flow, with FCP, LCP and a Performance score, on stock Lighthouse."
    />
    <meta
      property="og:image"
      content="https://push-based.github.io/lighthouse-soft-navigation/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="lighthouse-soft-navigation: soft navigations, measured as navigations"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <script>
      // Apply a stored theme before the first paint so the page never flashes the wrong one.
      try {
        var theme = localStorage.getItem(
          'lighthouse-soft-navigation-docs-theme',
        );
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme);
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <docs-root></docs-root>
  </body>
</html>
